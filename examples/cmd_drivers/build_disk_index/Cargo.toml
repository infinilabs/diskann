[package]
name = "build_disk_index"
version = "0.1.0"
edition = "2021"
description = "Command-line tool for building disk-based DiskANN indices"
license = "MIT"
repository = "https://github.com/infinilabs/diskann"
keywords = ["diskann", "index", "build", "cli"]
categories = ["command-line-utilities"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
diskann = "0.1.0"
diskann-vector = "0.1.0"
num_cpus = "1.16"
#openblas-src = { version = "0.10.8", features = ["system", "static"] }
