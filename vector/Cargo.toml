[package]
name = "diskann-vector"
version = "0.1.0"
edition = "2021"
description = "Vector operations and distance metrics for DiskANN, supporting f32, f16, and various distance functions"
license = "MIT"
repository = "https://github.com/infinilabs/diskann"
keywords = ["vector", "distance", "metrics", "ann", "search"]
categories = ["algorithms"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
half = "2.2.1"
thiserror = "1.0.40"
bytemuck = "1.7.0"

[dev-dependencies]
base64 = "0.21.2"
bincode = "1.3.3"
serde = "1.0.163"
approx = "0.5.1"
rand = "0.8.5"

