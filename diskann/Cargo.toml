[package]
name = "diskann"
version = "0.1.0"
edition = "2021"
authors = ["Microsoft Corporation"]
license = "MIT"
description = "High-performance approximate nearest neighbor search library"
repository = "https://github.com/infinilabs/diskann"
keywords = ["ann", "nearest-neighbor", "vector-search", "machine-learning"]
categories = ["algorithms", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["default_feature", "disk_store"]

# optional features
default_feature = []    # no any dependency
disk_store = []
disk_store_windows = []
disk_store_linux = []

[dependencies]
diskann-vector = { path = "../vector" }
diskann-platform = { path = "../platform" }
vector_base64 = { path = "../vector_base64" }

# Add missing dependencies for testing
tempfile = "3.8"
approx = "0.5"

# Core dependencies
hashbrown = "0.14"
rand = "0.8"
rayon = "1.8"
crossbeam = "0.8"
byteorder = "1.4"
num-traits = "0.2"
bit-vec = "0.6"
thiserror = "1.0"

# Tracing ecosystem for logging and instrumentation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
tracing-appender = "0.2"
serde_json = "1.0"

cfg-if = "1.0.1"
libc = "1.0.0-alpha.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "errhandlingapi",
    "fileapi",
    "ioapiset",
    "handleapi",
    "winnt",
    "minwindef",
    "basetsd",
    "winerror",
    "winbase",
] }

windows = { version = "0.61.3", features = [
    "Win32_System_IO",
] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "distance_bench"
harness = false

[[bench]]
name = "kmeans_bench"
harness = false

[[bench]]
name = "neighbor_bench"
harness = false
