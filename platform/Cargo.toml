[package]
name = "diskann-platform"
version = "0.1.0"
edition = "2021"
description = "Cross-platform utilities for DiskANN, providing Windows-specific optimizations with generic fallbacks"
license = "MIT"
repository = "https://github.com/infinilabs/diskann"
keywords = ["platform", "windows", "io", "performance"]
categories = ["api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log="0.4.18"
cfg-if = "1.0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["errhandlingapi", "fileapi", "ioapiset", "handleapi", "winnt", "minwindef", "basetsd", "winerror", "winbase"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
